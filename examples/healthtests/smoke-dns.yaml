# In-cluster DNS smoke test.
#
# Verifies CoreDNS resolves the well-known kubernetes.default.svc name and
# returns the expected ClusterIP family. Useful as a post-upgrade sanity
# check or as part of a pre-flight before deploying anything that depends
# on service discovery.
#
# Run:
#   khealth test run examples/healthtests/smoke-dns.yaml
apiVersion: khealth.io/v1alpha1
kind: HealthTest
metadata:
  name: smoke-dns
  labels:
    suite: smoke
spec:
  description: CoreDNS resolves kubernetes.default.svc.cluster.local
  timeout: 90s
  setup:
    - apply:
        inline: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: khealth-dns-probe
            namespace: kube-system
            labels:
              app: khealth-dns-probe
          spec:
            restartPolicy: Never
            containers:
              - name: probe
                image: busybox:1.36
                command: ["sleep", "120"]
      waitFor:
        condition: Ready
        timeout: 30s
  steps:
    - name: resolve-kubernetes-default
      exec:
        pod:
          namespace: kube-system
          labelSelector: app=khealth-dns-probe
        command: ["nslookup", "kubernetes.default.svc.cluster.local"]
        expect:
          exitCode: 0
          stdout:
            contains: "kubernetes.default.svc"
          stderr:
            notContains: "NXDOMAIN"
  cleanup:
    onSuccess: true
    onFailure: false
