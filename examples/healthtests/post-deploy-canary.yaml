# Post-deploy canary: the example referenced from docs/declarative-tests.md.
#
# Asserts the storefront deployment is fully rolled out, the public endpoint
# returns 200, and there are no panics in recent logs.
#
# Run:
#   khealth test run examples/healthtests/post-deploy-canary.yaml --keep-on-failure
apiVersion: khealth.io/v1alpha1
kind: HealthTest
metadata:
  name: storefront-canary
  labels:
    suite: post-deploy
spec:
  description: |
    Sanity-check the storefront after a deploy:
      - deployment is rolled out
      - public endpoint returns 200
      - no panics in the last 2 minutes of logs
  timeout: 3m
  setup:
    - apply:
        inline: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: khealth-curl
            namespace: storefront
            labels:
              app: khealth-curl
          spec:
            restartPolicy: Never
            containers:
              - name: curl
                image: curlimages/curl:8.6.0
                command: ["sleep", "300"]
      waitFor:
        condition: Ready
        timeout: 30s
  steps:
    - name: deployment-rolled-out
      k8sObject:
        apiVersion: apps/v1
        kind: Deployment
        namespace: storefront
        name: web
        expect:
          jsonPath:
            - path: ".status.readyReplicas"
              equalsField: ".spec.replicas"
            - path: ".status.conditions[?(@.type=='Available')].status"
              equals: "True"

    - name: public-endpoint-200
      http:
        url: http://web.storefront.svc.cluster.local/health
        expect:
          statusCode: 200
          latency:
            lessThan: 800ms

    - name: no-panic-in-logs
      log:
        pod:
          namespace: storefront
          labelSelector: app=web
        since: 2m
        expect:
          notMatches: "panic:"
  cleanup:
    onSuccess: true
    onFailure: false
