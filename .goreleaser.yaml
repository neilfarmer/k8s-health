version: 2

project_name: khealth

before:
  hooks:
    - go mod tidy

builds:
  - id: khealth
    main: ./cmd/khealth
    binary: khealth
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/neilfarmer/k8s-health/internal/version.Version={{ .Version }}
      - -X github.com/neilfarmer/k8s-health/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/neilfarmer/k8s-health/internal/version.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: khealth
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/**/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

dockers:
  - id: khealth-amd64
    image_templates:
      - "ghcr.io/neilfarmer/k8s-health:{{ .Version }}-amd64"
      - "ghcr.io/neilfarmer/k8s-health:latest-amd64"
    use: buildx
    dockerfile: Dockerfile.release
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/neilfarmer/k8s-health"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

  - id: khealth-arm64
    image_templates:
      - "ghcr.io/neilfarmer/k8s-health:{{ .Version }}-arm64"
      - "ghcr.io/neilfarmer/k8s-health:latest-arm64"
    use: buildx
    dockerfile: Dockerfile.release
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/neilfarmer/k8s-health"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

docker_manifests:
  - name_template: "ghcr.io/neilfarmer/k8s-health:{{ .Version }}"
    image_templates:
      - "ghcr.io/neilfarmer/k8s-health:{{ .Version }}-amd64"
      - "ghcr.io/neilfarmer/k8s-health:{{ .Version }}-arm64"
  - name_template: "ghcr.io/neilfarmer/k8s-health:latest"
    image_templates:
      - "ghcr.io/neilfarmer/k8s-health:latest-amd64"
      - "ghcr.io/neilfarmer/k8s-health:latest-arm64"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Dependencies
      regexp: '^.*?deps(\(.+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: neilfarmer
    name: k8s-health
  draft: false
  prerelease: auto
  name_template: "khealth {{ .Tag }}"
