name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run unit tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null .

  acceptance-test:
    runs-on: ubuntu-latest
    needs: [unit-test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install KIND
        run: |
          [ $(uname -m) = x86_64 ] && curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Create KIND cluster
        run: kind create cluster --config test/acceptance/kind-config.yaml --wait 120s
      - name: Build binary
        run: go build -o k8s-health .
      - name: Setup test fixtures
        run: |
          kubectl create namespace test-fixtures
          kubectl apply -f test/acceptance/fixtures/
          echo "Waiting for bad states to manifest..."
          sleep 45
      - name: Run acceptance tests
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config
        run: |
          kind get kubeconfig > ${{ github.workspace }}/.kube/config 2>/dev/null || true
          go test -tags acceptance -v -timeout 300s ./test/acceptance/...
      - name: Cleanup
        if: always()
        run: kind delete cluster
