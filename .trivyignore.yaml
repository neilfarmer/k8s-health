# Allowlist for Trivy image scans.
#
# Use this file to ignore vulnerabilities that have no upstream fix or that
# are not exploitable in this binary's context. Each entry MUST include:
#   - id: the CVE / GHSA / OSV ID
#   - statement: short rationale (why this is safe to ignore here)
#   - expired_at: hard expiry — the entry stops applying after this date and
#     the CI gate will block again until it's renewed or removed.
#
# Optional fields:
#   - paths: scope the ignore to specific files inside the image
#   - purls: scope to specific package URLs (preferred for go-module CVEs)
#
# Add entries one at a time, with a comment above each pointing at the issue
# tracker (GitHub issue / Jira) so we can revisit.
#
# Reference: https://aquasecurity.github.io/trivy/latest/docs/configuration/filtering/

vulnerabilities: []

